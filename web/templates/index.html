<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvartis — предсказание цены</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f4f6f9; color: #333; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: 600; width: 220px; color: #4e5d6c; }
        input, select { padding: 10px; width: 360px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
       
        button {
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            transition: background 0.2s;
        }
       
        button:hover { background: #0056b3; }
        .result { margin-top: 30px; padding: 20px; background: #d4edda; border: 2px solid #28a745; border-radius: 8px; font-size: 24px; font-weight: bold; color: #155724; text-align: center; }
    </style>
</head>
<body>
    <h1>Kvartis — оценка стоимости квартиры</h1>
   
    <form method="post" onsubmit="return validateFloors()">
        <div class="form-group">
            <label>Город:</label>
            <select name="city" required>
                <option value="Moscow" {% if inputs.get('city') == 'Moscow' %}selected{% endif %}>Москва</option>
                <option value="Petersburg" {% if inputs.get('city') == 'Petersburg' %}selected{% endif %}>Санкт-Петербург</option>
                <option value="Novosibirsk" {% if inputs.get('city') == 'Novosibirsk' %}selected{% endif %}>Новосибирск</option>
                <option value="Yekaterinburg" {% if inputs.get('city') == 'Yekaterinburg' %}selected{% endif %}>Екатеринбург</option>
                <option value="Kazan" {% if inputs.get('city') == 'Kazan' %}selected{% endif %}>Казань</option>
                <option value="Nizhny Novgorod" {% if inputs.get('city') == 'Nizhny Novgorod' %}selected{% endif %}>Нижний Новгород</option>
                <option value="Krasnoyarsk" {% if inputs.get('city') == 'Krasnoyarsk' %}selected{% endif %}>Красноярск</option>
                <option value="Samara" {% if inputs.get('city') == 'Samara' %}selected{% endif %}>Самара</option>
            </select>
        </div>
       
        <div class="form-group">
            <label>Количество комнат:</label>
            <input type="number" name="rooms" min="1" max="10" value="{{ inputs.get('rooms', 3) }}" required>
        </div>
       
        <div class="form-group">
            <label>Общая площадь (м²):</label>
            <input type="number" step="0.01" name="m2" min="10" max="500" value="{{ inputs.get('m2', 79) }}" required>
        </div>

        <div class="form-group">
            <label>Площадь кухни (м²):</label>
            <input type="number" step="0.01" name="kitchen_m2" min="2" max="100" value="{{ inputs.get('kitchen_m2', 15) }}" required>
        </div>
       
        <div class="form-group">
            <label>Состояние ремонта:</label>
            <select name="repair" required>
                <option value="not_needs" {% if inputs.get('repair') == 'not_needs' %}selected{% endif %}>Не требует ремонта</option>
                <option value="needs" {% if inputs.get('repair') == 'needs' %}selected{% endif %}>Требует косметический ремонт</option>
                <option value="absolutely_needs" {% if inputs.get('repair') == 'absolutely_needs' %}selected{% endif %}>Требует капитальный ремонт</option>
            </select>
        </div>

        <div class="form-group">
            <label>Качество района:</label>
            <select name="district" required>
                <option value="very good" {% if inputs.get('district') == 'very good' %}selected{% endif %}>Очень хороший</option>
                <option value="good" {% if inputs.get('district') == 'good' %}selected{% endif %}>Хороший</option>
                <option value="medium" {% if inputs.get('district') == 'medium' %}selected{% endif %}>Средний</option>
                <option value="bad" {% if inputs.get('district') == 'bad' %}selected{% endif %}>Плохой</option>
                <option value="very bad" {% if inputs.get('district') == 'very bad' %}selected{% endif %}>Очень плохой</option>
            </select>
        </div>

        <div class="form-group">
            <label>Год постройки дома:</label>
            <input type="number" name="year" min="1800" max="2026" value="{{ inputs.get('year', 1969) }}" required>
        </div>
       
        <div class="form-group">
            <label>Этаж квартиры:</label>
            <input type="number" id="floor" name="floor" min="1" max="100" value="{{ inputs.get('floor', 5) }}" required>
        </div>
       
        <div class="form-group">
            <label>Всего этажей в здании:</label>
            <input type="number" id="all_floor" name="all_floor" min="1" max="100" value="{{ inputs.get('all_floor', 6) }}" required>
        </div>
       
        <button type="submit">Рассчитать стоимость</button>
    </form>
    
    {% if result %}
    <div class="result">
        {{ result }}
    </div>
    {% endif %}

    <script>
        function validateFloors() {
            var floor = parseInt(document.getElementById('floor').value);
            var allFloor = parseInt(document.getElementById('all_floor').value);
            if (floor > allFloor) {
                alert("Ошибка: Этаж квартиры не может быть выше этажности дома!");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
